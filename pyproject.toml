[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zabbix-mcp-server"
version = "1.0.0"
description = "Servidor MCP Universal para Zabbix com 100 ferramentas em português para automação, monitoramento e relatórios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Natanael Krindges", email = "natanael@example.com" }
]
keywords = ["zabbix", "mcp", "model-context-protocol", "observability", "monitoring", "automation", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration"
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
zabbix-mcp = "zabbix_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zabbix_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
